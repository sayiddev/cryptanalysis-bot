[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.core.data" = ["*.json", "*.txt"]
"app.bot.webapp" = ["*.html"]

[project]
name = "cryptanalysis-bot"
version = "0.1.0"
description = "Telegram cryptanalysis bot: auto-decode chains + classic cipher breaking (own implementation)"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "bandit>=1.7",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
